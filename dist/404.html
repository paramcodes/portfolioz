</button> <script>
      // View-Transitions-safe boot: global listeners bind once (delegated),
      // per-page bindings re-run on every `astro:page-load`.
      const applyTheme = (t) => {
        const root = document.documentElement;
        root.dataset.theme = t;
        try { localStorage.setItem('theme', t); } catch {}
        document.body.classList.toggle('bg-[#07070b]', t === 'dark');
        document.body.classList.toggle('text-zinc-100', t === 'dark');
        document.body.classList.toggle('bg-[#fafaf9]', t === 'light');
        document.body.classList.toggle('text-zinc-900', t === 'light');
        document.querySelectorAll('.theme-icon-dark').forEach(e => e.classList.toggle('hidden', t !== 'dark'));
        document.querySelectorAll('.theme-icon-light').forEach(e => e.classList.toggle('hidden', t !== 'light'));
      };

      const bindGlobals = () => {
        // scroll progress + nav + to-top (dynamic lookups, survives page swaps)
        const onScroll = () => {
          const h = document.documentElement;
          const progress = document.getElementById('progress');
          const toTop = document.getElementById('to-top');
          const nav = document.getElementById('navbar');
          const p = h.scrollTop / (h.scrollHeight - h.clientHeight || 1);
          if (progress) progress.style.transform = `scaleX(${p})`;
          if (toTop) {
            const show = h.scrollTop > 700;
            toTop.classList.toggle('translate-y-20', !show);
            toTop.classList.toggle('opacity-0', !show);
          }
          if (nav) {
            nav.classList.toggle('bg-[#07070b]/80', h.scrollTop > 24);
            nav.classList.toggle('backdrop-blur-xl', h.scrollTop > 24);
            nav.classList.toggle('border-white/10', h.scrollTop > 24);
          }
        };
        document.addEventListener('scroll', onScroll, { passive: true });

        // delegated clicks: theme toggle, menu, filters, to-top, mobile links
        document.addEventListener('click', (e) => {
          const t = e.target;
          if (!(t instanceof Element)) return;
          if (t.closest('[data-toggle-theme]')) {
            applyTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
            return;
          }
          const menuBtn = t.closest('#menu-btn');
          if (menuBtn) {
            const mm = document.getElementById('mobile-menu');
            if (!mm) return;
            const open = mm.classList.toggle('hidden');
            menuBtn.setAttribute('aria-expanded', String(!open));
            return;
          }
          if (t.closest('#mobile-menu a')) {
            document.getElementById('mobile-menu')?.classList.add('hidden');
          }
          if (t.closest('#to-top')) {
            window.scrollTo({ top: 0, behavior: 'smooth' });
            return;
          }
          const fbtn = t.closest('[data-filter]');
          if (fbtn) {
            const scope = fbtn.closest('section') || document;
            const btns = scope.querySelectorAll('[data-filter]');
            const cards = scope.querySelectorAll('[data-category]');
            btns.forEach(b => {
              b.classList.remove('bg-[#d4ff4f]', 'text-black', 'border-transparent');
              b.classList.add('text-zinc-400');
            });
            fbtn.classList.add('bg-[#d4ff4f]', 'text-black', 'border-transparent');
            fbtn.classList.remove('text-zinc-400');
            const f = fbtn.getAttribute('data-filter');
            cards.forEach(c => {
              const show = f === 'all' || c.getAttribute('data-category') === f;
              c.classList.toggle('hidden', !show);
              if (show) { c.classList.remove('is-visible'); requestAnimationFrame(() => requestAnimationFrame(() => c.classList.add('is-visible'))); }
            });
          }
        });

        // delegated form submit (contact demo)
        document.addEventListener('submit', (e) => {
          const form = e.target;
          if (!(form instanceof HTMLFormElement) || form.id !== 'contact-form') return;
          e.preventDefault();
          document.getElementById('form-ok')?.classList.remove('hidden');
          form.reset();
          setTimeout(() => document.getElementById('form-ok')?.classList.add('hidden'), 5000);
        });

        // cursor glow (dynamic lookup each frame)
        let gx = -999, gy = -999, tx = gx, ty = gy;
        window.addEventListener('pointermove', (e) => {
          tx = e.clientX; ty = e.clientY;
          const glow = document.getElementById('cursor-glow');
          if (glow) glow.style.opacity = '1';
        }, { passive: true });
        (function follow() {
          gx += (tx - gx) * 0.08;
          gy += (ty - gy) * 0.08;
          const glow = document.getElementById('cursor-glow');
          if (glow) glow.style.transform = `translate(${gx - 240}px, ${gy - 240}px)`;
          requestAnimationFrame(follow);
        })();

        // IST clock
        const tickClock = () => {
          const clock = document.getElementById('local-time');
          if (clock) clock.textContent = new Date().toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', timeZone: 'Asia/Kolkata' });
        };
        tickClock(); setInterval(tickClock, 20000);
      };

      const initPage = () => {
        // theme (persisted)
        let saved = 'dark';
        try { saved = localStorage.getItem('theme') || document.documentElement.dataset.theme || 'dark'; } catch {}
        applyTheme(saved);

        // reveal on scroll
        if (window.__revealIO) window.__revealIO.disconnect();
        const io = new IntersectionObserver((entries) => {
          entries.forEach(en => {
            if (en.isIntersecting) {
              en.target.classList.add('is-visible');
              io.unobserve(en.target);
            }
          });
        }, { threshold: 0.12, rootMargin: '0px 0px -40px 0px' });
        window.__revealIO = io;
        document.querySelectorAll('.reveal').forEach(el => io.observe(el));

        // counters
        if (window.__countIO) window.__countIO.disconnect();
        const cio = new IntersectionObserver((entries) => {
          entries.forEach(en => {
            if (!en.isIntersecting) return;
            const el = en.target;
            cio.unobserve(el);
            const target = parseFloat(el.dataset.count || '0');
            const dur = 1400;
            const t0 = performance.now();
            const tick = (t) => {
              const p = Math.min((t - t0) / dur, 1);
              const eased = 1 - Math.pow(1 - p, 3);
              el.textContent = Math.round(target * eased).toString();
              if (p < 1) requestAnimationFrame(tick);
            };
            requestAnimationFrame(tick);
          });
        }, { threshold: 0.5 });
        window.__countIO = cio;
        document.querySelectorAll('[data-count]').forEach(el => cio.observe(el));

        // spotlight
        document.querySelectorAll('.spotlight').forEach((card) => {
          card.addEventListener('pointermove', (e) => {
            const r = card.getBoundingClientRect();
            card.style.setProperty('--mx', (e.clientX - r.left) + 'px');
            card.style.setProperty('--my', (e.clientY - r.top) + 'px');
          });
        });

        // highlight current page in nav (sections handled by observer below)
        try {
          const path = location.pathname.replace(/\/$/, '') || '/';
          links.forEach(l => {
            const p = new URL(l.getAttribute('href') || '', location.origin).pathname.replace(/\/$/, '') || '/';
            if (p !== '/' && p === path) l.classList.add('text-[#d4ff4f]');
          });
        } catch {}

        // active nav link (supports /#section hrefs)
        if (window.__navIO) window.__navIO.disconnect();
        const links = [...document.querySelectorAll('[data-navlink]')];
        const sio = new IntersectionObserver((entries) => {
          entries.forEach(en => {
            if (en.isIntersecting) {
              links.forEach(l => l.classList.remove('text-[#d4ff4f]'));
              const match = links.find(l => (l.getAttribute('href') || '').endsWith('#' + en.target.id));
              match?.classList.add('text-[#d4ff4f]');
            }
          });
        }, { rootMargin: '-40% 0px -55% 0px' });
        window.__navIO = sio;
        ['work','about','services','experience','achievements','contact'].forEach(id => {
          const s = document.getElementById(id);
          if (s) sio.observe(s);
        });

        // tilt + magnetic (fresh elements each navigation)
        if (matchMedia('(pointer:fine)').matches) {
          document.querySelectorAll('.tilt').forEach((el) => {
            el.addEventListener('pointermove', (e) => {
              const r = el.getBoundingClientRect();
              const rx = ((e.clientY - r.top) / r.height - 0.5) * -8;
              const ry = ((e.clientX - r.left) / r.width - 0.5) * 10;
              el.style.transform = `perspective(900px) rotateX(${rx}deg) rotateY(${ry}deg) translateY(-4px)`;
            });
            el.addEventListener('pointerleave', () => { el.style.transform = ''; });
          });
          document.querySelectorAll('.magnetic').forEach((el) => {
            el.addEventListener('pointermove', (e) => {
              const r = el.getBoundingClientRect();
              const x = e.clientX - r.left - r.width / 2;
              const y = e.clientY - r.top - r.height / 2;
              el.style.transform = `translate(${x * 0.12}px, ${y * 0.12}px)`;
            });
            el.addEventListener('pointerleave', () => { el.style.transform = ''; });
          });
        }

        // footer year
        const y = document.getElementById('year');
        if (y) y.textContent = new Date().getFullYear();

        // mermaid diagrams (blog posts)
        initMermaid();
      };

      const initMermaid = () => {
        const blocks = document.querySelectorAll('pre.mermaid[data-code]');
        if (!blocks.length) return;
        const render = () => {
          try {
            window.mermaid.initialize({ startOnLoad: false, theme: 'dark' });
            blocks.forEach((el) => {
              if (el.dataset.done) return;
              el.dataset.done = '1';
              const bytes = Uint8Array.from(atob(el.dataset.code), (c) => c.charCodeAt(0));
              const code = new TextDecoder().decode(bytes);
              window.mermaid.render('mmd-' + Math.random().toString(36).slice(2), code).then(({ svg }) => {
                el.innerHTML = svg;
                el.classList.add('mermaid-rendered');
              }).catch(() => {
                const pre = document.createElement('pre');
                pre.className = 'dark-isle overflow-x-auto rounded-xl border border-white/10 bg-black/50 p-4 font-mono text-xs text-zinc-300';
                pre.textContent = code;
                el.replaceWith(pre);
              });
            });
          } catch {}
        };
        if (window.mermaid) { render(); return; }
        if (window.__mermaidLoading) {
          const wait = setInterval(() => {
            if (window.mermaid) { clearInterval(wait); render(); }
          }, 200);
          return;
        }
        window.__mermaidLoading = true;
        const s = document.createElement('script');
        s.src = 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js';
        s.onload = () => { render(); };
        document.head.appendChild(s);
      };

      const boot = () => {
        if (!window.__booted) { window.__booted = true; bindGlobals(); }
        initPage();
      };
      document.addEventListener('astro:page-load', boot);
      boot();
    </script> </body> </html>
